[test]
# Hele treet, minus det som ikke er testkode. Alternativet — å la root peke på
# én katalog — betyr at en test som havner utenfor den aldri kjøres, og det er
# en stille feil: suiten er grønn fordi fila ikke ble funnet.
#
# Utelatelsene er ikke stilvalg. external/ er 21 GB og bibles_raw/ 21 000
# datafiler — uten dem tar vandringen over minuttet. kvn/ har sin egen suite
# med egen tsconfig (`bun run test:kvn`, kjøres av `test:all`).
root = "."
pathIgnorePatterns = [
    "**/node_modules/**",
    "**/external/**",
    "**/bibles_raw/**",
    "**/kvn/**",
]
